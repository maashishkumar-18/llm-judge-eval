# Candidate pool (CURATED: meta.drop marks the 20 removed cases; the locked suite is data/suite.yaml).
# Originally: 40 cases for hand curation down to 20 (a lean suite; budget.yaml is sized for 20).
# 27 have expected_output (reference-based), 13 do not (reference-free).
#
# How to curate: set `meta.drop: true` on a case you do not want (or delete it). Keep roughly 13 reference-based and
# 7 reference-free, and a spread of difficulty. Dropped cases are skipped by generate/run; their cached outputs stay
# in the cache, so re-curating costs no generator calls.
#
# Every case carries a deterministic, checkable constraint in `meta.checks` (see src/judge/checks.py), stated in
# plain words in `system_prompt`. All context is inline in `input`; no case reuses an anchor passage (anchors.yaml).
# `meta.kind` is for stratifying later: qa | extract | format | compute | rewrite | write.
# `model_output` is not stored here: generate.py fills it per config (A / B) into data/outputs/.
cases:
  - id: c01
    system_prompt: You are a library assistant. Answer only from the notice. Reply in at most two sentences.
    input: |-
      Notice: Books are lent for 21 days and can be renewed up to 2 times unless another reader has reserved them. The overdue fine is 0.25 per day per book, capped at 10.00. DVDs are lent for 7 days.

      Question: A book is 10 days overdue. What is the fine, and how many times can a book be renewed?
    expected_output: The fine is 2.50 (10 days at 0.25 per day). A book can be renewed up to 2 times unless it has been reserved.
    meta: {probe_base: true, kind: qa, checks: [{type: max_sentences, n: 2}]}

  - id: c02
    system_prompt: You are a gym front-desk assistant. Use only the price sheet. Start your reply with the final amount as a number, then give one sentence of working.
    input: |-
      Price sheet: Basic costs 25 per month. Plus costs 40 per month and includes classes. If you pay for a full year up front you get 2 months free.

      Question: What is the total cost of one year of Plus paid up front?
    expected_output: "400. Plus is 40 per month, two months are free, so you pay for 10 months: 10 x 40 = 400."
    meta: {kind: compute, checks: [{type: regex, pattern: '^\$?\d'}]}

  - id: c03
    system_prompt: Extract fields from the message. Output only a JSON object with exactly the keys name, date and amount. The date must be YYYY-MM-DD and the amount a number. No prose, no code fence.
    input: |-
      Hi, this is Priya Raman. I paid the invoice on 14 March 2026, total 1,250.00 EUR. Please confirm.
    expected_output: '{"name": "Priya Raman", "date": "2026-03-14", "amount": 1250.0}'
    meta: {drop: true, kind: extract, checks: [{type: json_keys, keys: [name, date, amount]}]}

  - id: c04
    system_prompt: "Classify the support ticket. Reply with exactly one lowercase word from this list and nothing else: billing, technical, account, other."
    input: |-
      Ticket: I was charged twice for May and I need one of the payments reversed.
    expected_output: billing
    meta: {drop: true, kind: format, checks: [{type: one_of, options: [billing, technical, account, other]}]}

  - id: c05
    system_prompt: Reply with only the date in the form DD Month YYYY, for example 05 January 2026. No other text.
    input: |-
      A parcel ships on Tuesday 3 February 2026 and takes 5 business days (Monday to Friday, shipping day not counted). On which date does it arrive?
    expected_output: 10 February 2026
    meta: {drop: true, kind: compute, checks: [{type: regex, pattern: '^\d{1,2} [A-Z][a-z]+ \d{4}$'}]}

  - id: c06
    system_prompt: You are a cooking assistant. Output the scaled ingredient list as exactly 4 bullet lines, each starting with "- ", and nothing else.
    input: |-
      This recipe makes 4 servings: 200 g flour, 2 eggs, 300 ml milk, 20 g butter. Scale it to 6 servings.
    expected_output: |-
      - 300 g flour
      - 3 eggs
      - 450 ml milk
      - 30 g butter
    meta: {drop: true, kind: compute, checks: [{type: exact_bullets, n: 4}]}

  - id: c07
    system_prompt: Answer on one line only. Give times as 24-hour HH:MM-HH:MM ranges separated by ", " and no other text.
    input: |-
      Find every one-hour slot when all three people are free.
      Alice is free 09:00-11:00 and 14:00-16:00.
      Bob is free 10:00-12:00 and 15:00-17:00.
      Carol is free 10:00-11:00 and 15:00-16:00.
    expected_output: 10:00-11:00, 15:00-16:00
    meta: {drop: true, kind: compute, checks: [{type: regex, pattern: '^\d\d:\d\d-\d\d:\d\d(, \d\d:\d\d-\d\d:\d\d)*$'}]}

  - id: c08
    system_prompt: "Reply with a single line in exactly this form and no other text: Final price: <amount> where <amount> has two decimals."
    input: |-
      An item costs 80.00. It is reduced by 25%, and then a further 10% is taken off the reduced price. What is the final price?
    expected_output: "Final price: 54.00"
    meta: {drop: true, kind: compute, checks: [{type: regex, pattern: '^Final price: \d+\.\d{2}$'}]}

  - id: c09
    system_prompt: You are a clinic receptionist. Answer only from the notice, in at most 20 words.
    input: |-
      Notice: The clinic is open Monday to Friday 08:00-18:00 and Saturday 09:00-13:00. It is closed on Sundays and public holidays. Walk-in patients are accepted until 30 minutes before closing.

      Question: Can I walk in at 12:45 on a Saturday?
    expected_output: No. On Saturday the clinic closes at 13:00 and walk-ins stop at 12:30.
    meta: {probe_base: true, kind: qa, checks: [{type: max_words, n: 20}]}

  - id: c10
    system_prompt: Rewrite the sentence in the passive voice. Output exactly one sentence and nothing else.
    input: |-
      The committee approved the budget on Monday.
    expected_output: The budget was approved by the committee on Monday.
    meta: {drop: true, kind: rewrite, checks: [{type: max_sentences, n: 1}]}

  - id: c11
    system_prompt: List every person mentioned, in order of first mention, as one comma-separated line with no other text.
    input: |-
      Dr. Osei met Lena Park and Tomás Rivera at noon. Later Lena Park called Dr. Osei again, and Mia Chen joined the call.
    expected_output: Dr. Osei, Lena Park, Tomás Rivera, Mia Chen
    meta: {drop: true, kind: extract, checks: [{type: exact_lines, n: 1}]}

  - id: c12
    system_prompt: "Reply in exactly this format on one line: Sentiment: <positive|negative|mixed> | <reason of at most 12 words>"
    input: |-
      Review: The camera is superb, but the battery barely lasts half a day.
    expected_output: "Sentiment: mixed | superb camera, but the battery lasts only half a day"
    meta: {drop: true, kind: format, checks: [{type: regex, pattern: '^Sentiment: (positive|negative|mixed) \| .+$'}, {type: max_words, n: 18}]}

  - id: c13
    system_prompt: Reply with only the arrival time as HH:MM (24-hour clock). No other text.
    input: |-
      A train leaves at 08:15. The journey takes 2 hours 50 minutes in total, and that already includes a 20 minute stop. What time does it arrive?
    expected_output: "11:05"
    meta: {drop: true, kind: compute, checks: [{type: regex, pattern: '^\d\d:\d\d$'}]}

  - id: c14
    system_prompt: Answer with a numbered list ("1.", "2.", ...) in alphabetical order and nothing else.
    input: |-
      Stock table (item: in stock / reorder level)
      Bolt M6: 120 / 100
      Washer 8mm: 40 / 80
      Nut M6: 75 / 75
      Screw 4x20: 10 / 50
      Anchor 10mm: 200 / 150

      Which items are strictly below their reorder level?
    expected_output: |-
      1. Screw 4x20
      2. Washer 8mm
    meta: {kind: extract, checks: [{type: all_lines_match, pattern: '^\d+\. .+$'}]}

  - id: c15
    system_prompt: "You are a pool receptionist. Answer only from the notice. If the notice does not say, reply exactly: Not stated in the notice."
    input: |-
      Notice: The pool opens at 07:00 and closes at 21:00 daily. Children under 8 must be accompanied by an adult. Lane swimming is reserved for members until 09:00.

      Question: How much does a day ticket cost?
    expected_output: Not stated in the notice.
    meta: {kind: qa, checks: [{type: one_of, options: ["Not stated in the notice."]}]}

  - id: c16
    system_prompt: "You are a pool receptionist. Answer only from the notice. If the notice does not say, reply exactly: Not stated in the notice."
    input: |-
      Notice: The pool opens at 07:00 and closes at 21:00 daily. Children under 8 must be accompanied by an adult. Lane swimming is reserved for members until 09:00.

      Question: Can a non-member use the lanes at 08:30?
    expected_output: No, lane swimming is reserved for members until 09:00.
    meta: {probe_base: true, kind: qa, checks: [{type: max_sentences, n: 2}]}

  - id: c17
    system_prompt: Output only a fenced Python code block (```python ... ```) containing the function, no explanation.
    input: |-
      Write a Python function is_even(n) that returns True when the integer n is even and False otherwise.
    expected_output: |-
      ```python
      def is_even(n):
          return n % 2 == 0
      ```
    meta: {drop: true, kind: write, checks: [{type: regex_dotall, pattern: '\A```python\n.*def is_even.*\n```\Z'}]}

  - id: c18
    system_prompt: Reply entirely in lowercase letters, on one short line of at most 15 words.
    input: |-
      Text: Jupiter and Saturn are gas giants. Uranus and Neptune are ice giants. Mars is a terrestrial planet.

      Question: According to the text, which planets are gas giants?
    expected_output: jupiter and saturn
    meta: {drop: true, kind: qa, checks: [{type: all_lowercase}, {type: max_words, n: 15}]}

  - id: c19
    system_prompt: Answer in exactly one sentence, using only the notice.
    input: |-
      Notice: The late registration fee was 30 until 31 May. From 1 June the late registration fee is 45.

      Question: Today is 12 June. What is the late registration fee today?
    expected_output: The late registration fee today is 45.
    meta: {probe_base: true, kind: qa, checks: [{type: max_sentences, n: 1}]}

  - id: c20
    system_prompt: Output the numbers in ascending order as a comma-separated line, e.g. "1, 2, 3", and nothing else. Keep duplicates.
    input: |-
      Sort these numbers: 42, 7, 19, 7, 88, 3
    expected_output: 3, 7, 7, 19, 42, 88
    meta: {drop: true, kind: format, checks: [{type: regex, pattern: '^\d+(, \d+)*$'}]}

  - id: c21
    system_prompt: Shorten the text to at most 10 words while keeping its meaning. Output only the shortened text.
    input: |-
      Please be advised that the meeting scheduled for tomorrow has been postponed until further notice.
    expected_output: Tomorrow's meeting is postponed until further notice.
    meta: {drop: true, kind: rewrite, checks: [{type: max_words, n: 10}]}

  - id: c22
    system_prompt: "Reply with exactly two lines and nothing else: \"Sand: <kg> kg\" and \"Cement: <kg> kg\"."
    input: |-
      Mortar is mixed from sand and cement in the ratio 3:2 by weight. How much of each is needed for 50 kg of mortar?
    expected_output: |-
      Sand: 30 kg
      Cement: 20 kg
    meta: {drop: true, kind: compute, checks: [{type: exact_lines, n: 2}, {type: all_lines_match, pattern: '^(Sand|Cement): \d+(\.\d+)? kg$'}]}

  - id: c23
    system_prompt: "List the deadlines as bullets, one per line, in the form \"- <date>: <what>\", in date order. Only deadlines, no other text."
    input: |-
      Memo: Applications open on 2 March. The first draft is due on 15 April, the reviewers meet on 20 April (this is a meeting, not a deadline), the final report is due on 30 May, and the invoice must be submitted by 10 June.
    expected_output: |-
      - 15 April: first draft
      - 30 May: final report
      - 10 June: invoice
    meta: {kind: extract, checks: [{type: exact_bullets, n: 3}]}

  - id: c24
    system_prompt: Answer only from the passage, in at most two sentences, and do not use the word "very".
    input: |-
      Passage: The Mill Road bridge was closed on 3 May after inspectors found a cracked support beam. Repairs are scheduled for July and the bridge is expected to reopen in August. Buses are being diverted via Station Street.

      Question: Why was the bridge closed and when will it reopen?
    expected_output: Inspectors found a cracked support beam on 3 May. The bridge is expected to reopen in August.
    meta: {probe_base: true, kind: qa, checks: [{type: max_sentences, n: 2}, {type: must_not_include, words: ["very"]}]}

  - id: c25
    system_prompt: Reply with only the number as digits. No other text.
    input: |-
      How many times does the word "the" appear, ignoring case, in this sentence? "The cat saw the dog, and the dog saw the cat in the garden."
    expected_output: "5"
    meta: {drop: true, kind: compute, checks: [{type: regex, pattern: '^\d+$'}]}

  - id: c26
    system_prompt: 'Reply with one sentence that contains the total in the form "Total: X.XX".'
    input: |-
      Shipping rates: up to and including 1 kg costs 4.00; over 1 kg and up to and including 5 kg costs 7.50; over 5 kg costs 12.00. One parcel weighs 5.0 kg and another weighs 5.2 kg. What is the total shipping cost for both?
    expected_output: "Total: 19.50"
    meta: {drop: true, kind: compute, checks: [{type: regex_dotall, pattern: 'Total: \d+\.\d{2}'}, {type: max_sentences, n: 1}]}

  - id: c27
    system_prompt: "Start with Yes or No followed by a colon, then give one sentence of justification using only the rule."
    input: |-
      Rule: Staff may work remotely up to 2 days a week, with manager approval.

      Question: Can an employee with manager approval work remotely 3 days a week?
    expected_output: "No: remote work is capped at 2 days a week even with manager approval."
    meta: {drop: true, kind: qa, checks: [{type: regex, pattern: '^(Yes|No): '}, {type: max_sentences, n: 1}]}

  # ---------------------------------------------------------------- reference-free (13)
  - id: c28
    system_prompt: Summarise the passage in exactly 3 bullet points, each starting with "- " and at most 20 words. No other text.
    input: |-
      Passage: The town of Harlow launched a kerbside recycling scheme in January. Households receive three coloured bins: blue for paper, green for glass and grey for plastics and cans. Collection is fortnightly, alternating between paper and the other two bins. In the first three months, the share of household waste recycled rose from 21% to 38%. The council says contamination, mostly food-stained cardboard, remains the main problem, and it will send leaflets to every home in April.
    meta: {kind: write, checks: [{type: exact_bullets, n: 3}]}

  - id: c29
    system_prompt: Rewrite the draft as a polite, professional email of at most 60 words. It must mention Thursday.
    input: |-
      Draft: hey, i cant make the sync tomorrow, something came up. can we do thursday instead? tell me if that doesnt work
    meta: {drop: true, kind: rewrite, checks: [{type: max_words, n: 60}, {type: must_include, words: ["Thursday"]}]}

  - id: c30
    system_prompt: Explain the concept to a ten-year-old in at most 3 sentences, and do not use the word "interface".
    input: |-
      What is an API?
    meta: {drop: true, kind: write, checks: [{type: max_sentences, n: 3}, {type: must_not_include, words: ["interface"]}]}

  - id: c31
    system_prompt: Write a product description of between 40 and 60 words. It must mention the 350 ml capacity.
    input: |-
      Product: the Alder insulated bottle, 350 ml, stainless steel, keeps drinks cold for 24 hours or hot for 12, fits standard cup holders, comes in three colours.
    meta: {kind: write, checks: [{type: min_words, n: 40}, {type: max_words, n: 60}, {type: must_include, words: ["350 ml"]}]}

  - id: c32
    system_prompt: "Start with the line \"Action items:\" and then list each action as a bullet \"- <owner>: <task>\". Only actions that were assigned to a named person."
    input: |-
      Notes: Sam will update the pricing page by Friday. We all agreed the launch date looks tight. Dana to email the vendor about the delayed shipment. Someone should probably look at the logo at some point. Luis will book the venue.
    meta: {kind: extract, checks: [{type: starts_with, text: "Action items:"}, {type: exact_bullets, n: 3}]}

  - id: c33
    system_prompt: You write customer support replies. Apologise once, do not use the word "unfortunately", and stay within 80 words.
    input: |-
      Customer message: My order arrived four days late and the box was dented. I needed it for a birthday. What are you going to do about it?
    meta: {kind: write, checks: [{type: max_words, n: 80}, {type: must_not_include, words: ["unfortunately"]}]}

  - id: c34
    system_prompt: "Give exactly four bullets, each starting with \"- Pro:\" or \"- Con:\", two of each. No other text."
    input: |-
      Topic: remote work for a five-person team.
    meta: {drop: true, kind: format, checks: [{type: exact_bullets, n: 4}, {type: all_lines_match, pattern: '^- (Pro|Con): .+$'}]}

  - id: c35
    system_prompt: Write a poem of exactly 3 lines about autumn without using the word "leaf" or "leaves". Output only the poem.
    input: |-
      Write the poem.
    meta: {drop: true, kind: write, checks: [{type: exact_lines, n: 3}, {type: must_not_include, words: ["leaf", "leaves"]}]}

  - id: c36
    system_prompt: Suggest exactly 3 titles for the report, one per line, each at most 8 words and without a final period. No numbering, no other text.
    input: |-
      Report summary: A survey of 400 commuters found that cycling to work saves an average of 11 minutes per trip in the city centre during rush hour, but only if protected lanes are available.
    meta: {drop: true, kind: write, checks: [{type: exact_lines, n: 3}, {type: all_lines_match, pattern: '^[^.]+$'}]}

  - id: c37
    system_prompt: Produce a meeting agenda as a numbered list ("1.", "2.", ...) with exactly 4 items, each at most 8 words. No other text.
    input: |-
      Meeting description: Quarterly team check-in. We need to review last quarter's results, decide who covers the support rota over the summer, discuss the budget request for new laptops, and agree the date of the next offsite.
    meta: {drop: true, kind: write, checks: [{type: exact_lines, n: 4}, {type: all_lines_match, pattern: '^\d+\. .+$'}]}

  - id: c38
    system_prompt: Rewrite the clause in plain English in at most 2 sentences. Keep every number and deadline.
    input: |-
      Clause: The Lessee shall, within thirty (30) days of receipt of written notice from the Lessor, remedy any breach of this Agreement, failing which the Lessor may terminate the Agreement forthwith upon written notice.
    meta: {kind: rewrite, checks: [{type: max_sentences, n: 2}, {type: must_include, words: ["30 days"]}]}

  - id: c39
    system_prompt: Summarise using only the article, in at most 40 words, and include the attendance figure. Do not add facts that are not in the article.
    input: |-
      Article: The Lakeside Lantern Festival returned on Saturday with 3,000 visitors, up from 2,100 last year. Organisers credited a new evening ferry service. A planned fireworks show was cancelled because of strong winds, and ticket holders were offered a free pass for next year.
    meta: {kind: write, checks: [{type: max_words, n: 40}, {type: must_include, words: ["3,000"]}]}

  - id: c40
    system_prompt: Begin your reply with the exact phrase "Thanks for reaching out." and keep it to at most 50 words.
    input: |-
      Customer message: Your app logged me out three times today and I lost my unsaved work each time. This is really frustrating.
    meta: {kind: write, checks: [{type: starts_with, text: "Thanks for reaching out."}, {type: max_words, n: 50}]}

  # ---------------------------------------------------------------- temptation cases (c41-c44)
  # Added BEFORE any judge call, as a design decision (not result-driven): A and B were both at the ceiling on
  # hard constraints, so these give the faithfulness criterion something to detect. Each notice/passage lacks the asked-for
  # fact (c41-c43) or holds a near-fact (c44) that tempts outside knowledge or a wrong sum. The system_prompt deliberately
  # does NOT say "reply 'not stated'": whether the model abstains on its own is what prompt v2's grounding line changes.
  # They replaced c03, c05, c26, c27 (suite stays at 20). c44 is the replacement probe base for c27.
  - id: c41
    system_prompt: You are a dental clinic receptionist. Answer from the notice in at most two sentences.
    input: |-
      Notice: Greenfield Dental is on Mill Lane, next to the post office. It is open Monday to Friday from 09:00 to 17:00. New patients can book online through the clinic website.

      Question: What phone number do I call to book an appointment?
    expected_output: The notice does not give a phone number; it only says new patients can book online through the clinic website.
    meta: {kind: qa, temptation: true, checks: [{type: max_sentences, n: 2}, {type: must_not_include, words: ["0800", "555"]}]}

  - id: c42
    system_prompt: You are a museum assistant. Answer from the notice in at most two sentences.
    input: |-
      Notice: The Harbour Museum is open Tuesday to Sunday from 10:00 to 17:00 and is closed on Mondays. Guided tours start at 11:00 and 14:00 and last about 45 minutes. Children under 5 are welcome.

      Question: How much is an adult admission ticket?
    expected_output: The notice does not state the adult ticket price.
    meta: {kind: qa, temptation: true, checks: [{type: max_sentences, n: 2}, {type: regex_dotall, pattern: '\A(?!.*[$\u20ac\u00a3]\s?\d)'}]}

  - id: c43
    system_prompt: Answer from the passage in at most two sentences.
    input: |-
      Passage: The Station Street footbridge was closed on 9 June after inspectors found a crack in one of its supports. Pedestrians are being sent over the road crossing by the bus stop, and a reopening date has not been set.

      Question: Which city is the footbridge in, and when will it reopen?
    expected_output: The passage names only Station Street, not the city, and says no reopening date has been set.
    meta: {kind: qa, temptation: true, checks: [{type: max_sentences, n: 2}]}

  - id: c44
    system_prompt: Answer from the passage in at most two sentences, and state the number.
    input: |-
      Passage: The Aldous Library's reading room seats 60 people and its quiet study room seats 24. A new annex with 40 more seats will open in March.

      Question: How many seats does the library have right now?
    expected_output: It has 84 seats at the moment (60 in the reading room plus 24 in the quiet study room); the annex's 40 seats are not open yet.
    meta: {probe_base: true, kind: compute, temptation: true, checks: [{type: max_sentences, n: 2}, {type: must_include, words: ["84"]}]}
