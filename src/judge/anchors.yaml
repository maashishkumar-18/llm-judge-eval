# Few-shot calibration anchors for the MITIGATED pointwise prompts (score-clustering mitigation).
# Rules: (1) these passages/questions must never appear in the eval suite (the suite must not reuse them);
# (2) every evidence span must be a verbatim span of the answer (enforced by schemas.Anchor);
# (3) six anchors, listed in a deliberately mixed order (not sorted by score, to avoid a recency pull).
#
# Per-criterion scores (faithfulness / instruction_following / completeness) -> overall, pass?
#   anchor-high       5 5 5 -> 5.00 pass   reference-free, everything right
#   anchor-low        1 2 1 -> 1.35 fail   reference-free, confident hallucination
#   anchor-ref-price  3 5 3 -> 3.70 fail   REFERENCE-BASED, right conclusion but a wrong window and missing conditions;
#                                          overall >= 3.5 yet fails the pass rule because faithfulness < 4
#   anchor-mid        4 3 2 -> 3.15 fail   reference-free, prose where a bulleted list was required, thin coverage
#   anchor-format     5 3 5 -> 4.30 pass   reference-free, all facts right but three sentences where two are allowed
#   anchor-good       4 4 4 -> 4.00 pass   reference-free, solid answer with small slips on every criterion
# Together they use every score 1-5 for instruction_following and completeness, and 1, 3, 4, 5 for faithfulness.
anchors:
  - id: anchor-high
    case:
      id: anchor-high
      system_prompt: You are Northwind's support assistant. Answer using only the policy provided. Reply in at most two sentences.
      input: |-
        Policy: Items may be returned within 30 days of delivery in original packaging for a full refund. Refunds are issued to the original payment method within 5 business days of receipt. Final-sale items cannot be returned.

        Question: Can I return a jacket I received 12 days ago, and how long will the refund take?
      model_output: |-
        Yes, you can return it: it is within the 30-day window as long as it is in its original packaging and not a final-sale item. The refund goes to your original payment method within 5 business days of Northwind receiving the item.
    verdict:
      faithfulness:
        evidence: "it is within the 30-day window as long as it is in its original packaging and not a final-sale item"
        rationale: Every condition stated (30 days, original packaging, final-sale exclusion) comes from the policy; nothing is added.
        score: 5
      instruction_following:
        evidence: "The refund goes to your original payment method within 5 business days of Northwind receiving the item."
        rationale: The answer is exactly two sentences and uses only the supplied policy, as the system prompt requires.
        score: 5
      completeness:
        evidence: "within the 30-day window ... within 5 business days of Northwind receiving the item"
        rationale: It answers both parts of the question, eligibility (day 12 of 30) and refund timing.
        score: 5

  - id: anchor-low
    case:
      id: anchor-low
      system_prompt: You are Northwind's support assistant. Be accurate and concise.
      input: |-
        Policy: Electronics carry a 12-month limited warranty covering manufacturing defects. Accidental damage and water damage are not covered. Warranty claims require proof of purchase.

        Question: My Northwind speaker stopped working after I dropped it 8 months ago. Is it covered?
      model_output: |-
        Yes, absolutely! Northwind's premium 24-month warranty fully covers drops and accidents, so you're covered. Just send it in and we'll replace it free of charge, no receipt needed.
    verdict:
      faithfulness:
        evidence: "premium 24-month warranty fully covers drops and accidents"
        rationale: The policy gives a 12-month limited warranty that excludes accidental damage, and requires proof of purchase; the answer invents a 24-month warranty that covers drops.
        score: 1
      instruction_following:
        evidence: "no receipt needed"
        rationale: The answer is concise, but the system prompt also demands accuracy and this contradicts the proof-of-purchase requirement.
        score: 2
      completeness:
        evidence: "so you're covered"
        rationale: The correct conclusion is that a drop is accidental damage and is not covered; the answer reaches the opposite conclusion despite its confident tone.
        score: 1

  - id: anchor-ref-price
    case:
      id: anchor-ref-price
      system_prompt: You are Northwind's support assistant. Answer in one or two sentences.
      input: |-
        Policy: Northwind matches a competitor's lower price on an identical, in-stock item if the request is made within 14 days of purchase. Sale and clearance prices are excluded.

        Question: I bought a blender 10 days ago for $80 and saw the same one for $65 at a competitor's store. Can I get a price match?
      expected_output: |-
        Yes. You are within the 14-day window, so Northwind will match the $65 price, provided the competitor's blender is identical, in stock, and not a sale or clearance price.
      model_output: |-
        Yes, Northwind will price-match, since you are within the 30-day window and the competitor's price is lower.
    verdict:
      faithfulness:
        evidence: "you are within the 30-day window"
        rationale: The reference and the policy give a 14-day window, not 30; the conclusion happens to be right but one material detail is wrong.
        score: 3
      instruction_following:
        evidence: "Yes, Northwind will price-match, since you are within the 30-day window and the competitor's price is lower."
        rationale: It is a single sentence that answers the question directly, as required.
        score: 5
      completeness:
        evidence: "the competitor's price is lower"
        rationale: It gives the right yes/no but omits the conditions in the reference (identical item, in stock, sale and clearance prices excluded), so the user cannot tell whether the match will actually apply.
        score: 3

  - id: anchor-mid
    case:
      id: anchor-mid
      system_prompt: You are Northwind's shipping assistant. Answer as a short bulleted list.
      input: |-
        Policy: Standard shipping takes 3-5 business days. Express shipping takes 1-2 business days and costs $12. Orders over $75 ship Standard for free. Orders placed after 2 p.m. ship the next business day.

        Question: I'm ordering a $60 lamp at 4 p.m. on Tuesday and want it by Thursday. What are my options?
      model_output: |-
        Express shipping is 1-2 business days and costs $12, so it could arrive Thursday. Standard shipping is also available.
    verdict:
      faithfulness:
        evidence: "Express shipping is 1-2 business days and costs $12, so it could arrive Thursday."
        rationale: The Express timing and price are correct, but "could arrive Thursday" glosses over the 4 p.m. order shipping Wednesday, so Thursday is only the best case.
        score: 4
      instruction_following:
        evidence: "Standard shipping is also available."
        rationale: The answer is short and on topic but written as plain prose; the system prompt required a bulleted list.
        score: 3
      completeness:
        evidence: "Standard shipping is also available."
        rationale: It never says Standard takes 3-5 business days (so it would miss Thursday), that a $60 order does not get free Standard, or that the 2 p.m. cutoff delays shipping.
        score: 2

  - id: anchor-format
    case:
      id: anchor-format
      system_prompt: You are Northwind's rewards assistant. Answer in at most two sentences.
      input: |-
        Policy: Rewards members earn 1 point per $1 spent. Every 100 points can be redeemed for a $5 reward. Points expire after 12 months of account inactivity.

        Question: How many points do I get for a $240 purchase, and what are they worth?
      model_output: |-
        A $240 purchase earns 240 points. That is enough for two $5 rewards, with 40 points left over. Your points expire after 12 months of account inactivity.
    verdict:
      faithfulness:
        evidence: "enough for two $5 rewards, with 40 points left over"
        rationale: 240 points at 1 point per $1 is right, and 100 points per $5 reward gives two rewards and 40 points remaining; the expiry sentence also matches the policy.
        score: 5
      instruction_following:
        evidence: "Your points expire after 12 months of account inactivity."
        rationale: This is a third sentence; the system prompt allowed at most two. The content is correct, but an explicit length constraint is broken.
        score: 3
      completeness:
        evidence: "A $240 purchase earns 240 points ... two $5 rewards"
        rationale: Both parts of the question are answered, the points earned and what they are worth.
        score: 5

  - id: anchor-good
    case:
      id: anchor-good
      system_prompt: You are Northwind's support assistant. Answer in a short paragraph, ideally under 40 words.
      input: |-
        Policy: Gift wrap costs $4 per item and is free on orders over $100. Wrapped items ship in a gift box with a message card; messages can be up to 150 characters. Gift wrap cannot be added after the order ships.

        Question: I'm ordering two scarves at $45 each as a gift and want a card with a message. Do I pay for wrapping, and when must I decide?
      model_output: |-
        Your order is $90, under the $100 free-wrap threshold, so wrapping costs $4 per item, or $8 for both scarves. Each wrapped item comes with a free message card. Add the wrapping before your order ships, since it can't be added afterwards.
    verdict:
      faithfulness:
        evidence: "comes with a free message card"
        rationale: The $90 total, the $4 per item charge and the shipping deadline are all right; calling the card "free" is a small unsupported detail, since the policy only says wrapped items include one.
        score: 4
      instruction_following:
        evidence: "Add the wrapping before your order ships, since it can't be added afterwards."
        rationale: It is a short paragraph, but at 42 words it is slightly over the soft 40-word target.
        score: 4
      completeness:
        evidence: "Each wrapped item comes with a free message card"
        rationale: It answers whether the user pays, how much, and the deadline, but leaves out the 150-character limit on the card message, a minor point.
        score: 4
